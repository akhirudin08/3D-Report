<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Twin Gudang</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#dfe8ee;--panel:rgba(255,255,255,.9);--ink:#14262e;--mute:#5d7078;--line:rgba(20,38,46,.15);--acc:#ff7a1a;--ok:#1f9d6b;--warn:#d9a400;--idle:#8a98a0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17242c;--panel:rgba(26,40,48,.9);--ink:#e8f0f3;--mute:#93a6af;--line:rgba(232,240,243,.16)}}
:root[data-theme="dark"]{--bg:#17242c;--panel:rgba(26,40,48,.9);--ink:#e8f0f3;--mute:#93a6af;--line:rgba(232,240,243,.16)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;font-size:14px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px)}
#hud{left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:230px}
#hud h1{font-size:17px;margin:0 0 2px;font-weight:700}
#src{color:var(--mute);font-size:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.row b{font-weight:600}
#views{display:flex;gap:6px;margin-top:10px}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#detail{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:220px;display:none}
#detail h2{margin:0;font-size:16px}
#detail .sub{color:var(--mute);font-size:12px;margin-bottom:8px}
#detail .row span:first-child{color:var(--mute)}
#bar{height:6px;border-radius:3px;background:var(--line);margin:6px 0;overflow:hidden;display:none}
#bar i{display:block;height:100%;background:var(--acc);width:0}
#log{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100% - 24px);font-size:12px}
#log div{padding:2px 0;color:var(--mute)}#log div:first-child{color:var(--ink)}
#log em{font-style:normal;font-weight:600;color:var(--ink)}
.chip{position:fixed;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:11px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px 1px 5px;white-space:nowrap;display:flex;gap:4px;align-items:center;will-change:transform}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.chip.sel{border-color:var(--acc)}
@media (max-width:640px){#hud{width:170px}#detail{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:200px}#log{width:calc(100% - 24px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="chips"></div>
<div class="panel" id="hud">
  <h1>Digital Twin Gudang</h1>
  <div id="src">memuat…</div>
  <div id="counts"></div>
  <div id="views"><button data-v="top">Atas</button><button data-v="dock">Dock</button><button data-v="rack">Rak</button></div>
</div>
<div class="panel" id="detail">
  <h2 id="dName"></h2><div class="sub" id="dType"></div>
  <div id="dRows"></div><div id="bar"><i></i></div>
  <button id="follow">Ikuti</button> <button id="close">Tutup</button>
</div>
<div class="panel" id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   DATA CONTRACT (dari backend / WebSocket), satu pesan per objek:
   { id:"FL-01", type:"forklift|truck|handpallet|worker", label:"Forklift 1",
     x:12.5, z:-8, status:"Membawa pallet", state:"moving|working|idle",
     load:true, progress:40 }   // x,z = meter, titik nol = tengah gudang
   Bisa kirim satu objek atau array. Pakai: index.html?ws=wss://server-kamu
   Tanpa ?ws= -> simulator internal di bawah yang menghasilkan data dummy.
   ========================================================= */
const T=THREE,$=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- Scene ---------- */
const canvas=$('#c'),renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const bgCol=()=>new T.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
const scene=new T.Scene();scene.background=bgCol();scene.fog=new T.Fog(scene.background,130,280);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{scene.background=bgCol();scene.fog.color=bgCol()});
const cam=new T.PerspectiveCamera(45,1,.5,500);
scene.add(new T.HemisphereLight(0xffffff,0x8a9aa5,.8));
const sun=new T.DirectionalLight(0xffffff,.85);sun.position.set(30,55,35);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:150});
scene.add(sun);

const mc={},mat=c=>mc[c]||(mc[c]=new T.MeshLambertMaterial({color:c}));
const bx=(p,w,h,d,c,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m};
const wh=(p,x,y,z,r,w)=>{const m=new T.Mesh(new T.CylinderGeometry(r,r,w,12),mat(0x23282c));m.rotation.z=Math.PI/2;m.position.set(x,y,z);m.castShadow=true;p.add(m)};
const flat=(w,d,c,x,z,y=.02)=>{const m=new T.Mesh(new T.PlaneGeometry(w,d),mat(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m)};

/* ---------- Dunia statis: lantai, dinding, dock, rak ---------- */
const DOCKX=[-16,0,16];
flat(400,400,0x9aa89f,0,0,-.05);                 // tanah
flat(400,36,0x3a4146,0,38,0);                    // jalan
for(let x=-190;x<190;x+=8)flat(3,.3,0xe8e8e0,x,38,.03);
flat(64,40,0xc9ccc6,0,0);                        // lantai gudang
flat(56,8,0xb7c8bd,0,8,.03);                     // area staging
flat(64,8,0xd9cfb4,0,16,.03);                    // zona dock
[-14,-8].forEach(z=>flat(48,1.2,0xe5c24a,0,z,.04));flat(1.2,22,0xe5c24a,0,-8,.04);
const wall=(x0,x1,z,h)=>bx(scene,x1-x0,h,.5,0xe9ecee,(x0+x1)/2,h/2,z);
wall(-32,32,-20,5);bx(scene,.5,5,40,0xe9ecee,-32,2.5,0);bx(scene,.5,5,40,0xe9ecee,32,2.5,0);
[[-32,-19.5],[-12.5,-3.5],[3.5,12.5],[19.5,32]].forEach(([a,b])=>wall(a,b,20,2.6));
DOCKX.forEach(x=>{bx(scene,8,.4,.6,0xff7a1a,x,2.9,20);bx(scene,.6,2.9,.6,0x30363a,x-3.7,1.45,20.2);bx(scene,.6,2.9,.6,0x30363a,x+3.7,1.45,20.2);flat(7,3,0x2b3135,x,18.3,.05)});

const dm=new T.Object3D();
const rows=[-17,-11,-5],segs=[[-24,-3],[3,24]],levels=[.3,1.5,2.7];
const up=new T.InstancedMesh(new T.BoxGeometry(.2,3.7,.2),mat(0x2f6fb5),96);
const crates=new T.InstancedMesh(new T.BoxGeometry(2.4,1,1.3),new T.MeshLambertMaterial({color:0xffffff}),126);
let ui=0,ci=0;const palette=[0xc89b5a,0xb98b50,0xd4a96a,0x8fa8b8,0xe0c28a];
rows.forEach(rz=>segs.forEach(([a,b])=>{
  for(let i=0;i<=7;i++)[-.8,.8].forEach(dz=>{dm.position.set(a+i*3,1.85,rz+dz);dm.updateMatrix();up.setMatrixAt(ui++,dm.matrix)});
  levels.forEach(y=>{bx(scene,b-a,.12,1.7,0xff7a1a,(a+b)/2,y,rz);
    for(let i=0;i<7;i++){dm.position.set(a+i*3+1.5,y+.56,rz);dm.updateMatrix();crates.setMatrixAt(ci,dm.matrix);
      crates.setColorAt(ci++,new T.Color(Math.random()<.78?palette[Math.random()*5|0]:0x000000));
      if(false){}}});
}));
up.castShadow=crates.castShadow=true;scene.add(up,crates);
// slot kosong: sembunyikan sebagian crate (skala 0)
for(let i=0;i<ci;i++){if(Math.random()<.22){crates.getMatrixAt(i,dm.matrix);dm.matrix.decompose(dm.position,dm.quaternion,dm.scale);dm.scale.set(0,0,0);dm.updateMatrix();crates.setMatrixAt(i,dm.matrix)}}

/* ---------- Model low-poly ---------- */
const MODELS={
 truck(c){const g=new T.Group();
  bx(g,2.6,.3,10,0x30363a,0,.55,4.6);bx(g,2.6,2.7,9,0xeef2f4,0,2.25,4.5);
  bx(g,2.5,2.2,2.6,c,0,1.7,10.6);bx(g,2.52,.9,.1,0x9fd3e6,0,2.3,11.92);
  [1.2,2.5,9.6,11].forEach(z=>[-1.3,1.3].forEach(x=>wh(g,x,.55,z,.55,.4)));g.userData.h=4.6;return g},
 forklift(){const g=new T.Group();
  bx(g,1.3,.8,1.9,0xf5a300,0,.7,-.2);bx(g,1.2,.7,.6,0x3b3f42,0,.9,-1);
  [[-.55,-.6],[.55,-.6],[-.55,.3],[.55,.3]].forEach(([x,z])=>bx(g,.07,1.3,.07,0x333333,x,1.7,z));
  bx(g,1.25,.07,1,0x333333,0,2.35,-.15);bx(g,.35,.5,.3,0x1f2a30,0,1.35,-.3);
  [-.35,.35].forEach(x=>bx(g,.1,2.2,.1,0x555555,x,1.2,1));
  const f=new T.Group();f.position.set(0,.2,1.1);g.add(f);
  [-.3,.3].forEach(x=>bx(f,.12,.08,1.3,0x444444,x,0,.7));
  const cargo=new T.Group();cargo.position.set(0,.1,.7);f.add(cargo);cargo.visible=false;
  bx(cargo,.95,.12,1.2,0xb98b50,0,.06,0);bx(cargo,.85,.8,1,0xc89b5a,0,.52,0);
  [-.6,.6].forEach(x=>[-.6,.7].forEach(z=>wh(g,x,.32,z,.32,.2)));
  g.userData.cargo=cargo;g.userData.h=3;return g},
 handpallet(){const g=new T.Group();
  [-.28,.28].forEach(x=>bx(g,.2,.1,1.2,0x9aa4aa,x,.08,.2));bx(g,.7,.12,.2,0x9aa4aa,0,.12,-.45);
  bx(g,.06,1,.06,0xd64545,0,.65,-.7).rotation.x=.45;
  const cargo=new T.Group();cargo.visible=false;g.add(cargo);
  bx(cargo,.9,.12,1.1,0xb98b50,0,.2,.2);bx(cargo,.8,.7,.95,0xc89b5a,0,.62,.2);
  g.userData.cargo=cargo;g.userData.h=1.8;return g},
 worker(){const g=new T.Group(),b=new T.Group();g.add(b);
  bx(b,.3,.55,.2,0x2a3b4a,-.1,.28,0).scale.x=.6;bx(b,.14,.55,.18,0x2a3b4a,.1,.28,0);
  bx(b,.42,.55,.25,0xffd23f,0,.82,0);const h=new T.Mesh(new T.SphereGeometry(.17,10,8),mat(0xe0b48c));h.position.y=1.28;h.castShadow=true;b.add(h);
  const hat=new T.Mesh(new T.SphereGeometry(.19,10,6,0,Math.PI*2,0,Math.PI/2),mat(0xffffff));hat.position.y=1.33;b.add(hat);
  g.userData.body=b;g.userData.h=2;return g}
};
const TYPES={truck:'Truk',forklift:'Forklift',handpallet:'Hand pallet',worker:'Operator'};
const TCOL=[0x2f6fb5,0xc0392b,0x1f9d6b];

/* ---------- Registry entitas berbasis data ---------- */
const ents=new Map(),chips=$('#chips'),logEl=$('#log');
const STC={moving:'var(--ok)',working:'var(--warn)',idle:'var(--idle)'};
let sel=null,follow=false,nTruck=0;
function spawn(m){
  const g=(m.type==='truck'?MODELS.truck(TCOL[nTruck++%3]):MODELS[m.type]());g.position.set(m.x,0,m.z);scene.add(g);
  g.traverse(o=>o.userData.id=m.id);g.userData.id=m.id;
  const chip=document.createElement('div');chip.className='chip';chip.innerHTML='<i></i><span>'+m.id+'</span>';
  chip.onclick=()=>select(m.id);chips.appendChild(chip);
  return{id:m.id,g,chip,dot:chip.firstChild,target:new T.Vector3(m.x,0,m.z),speed:0,rot:0,d:m,seen:performance.now()};
}
function onData(msg){
  (Array.isArray(msg)?msg:[msg]).forEach(m=>{
    let e=ents.get(m.id);if(!e)ents.set(m.id,e=spawn(m));
    if(e.d.status!==m.status&&e.d.status)addLog(m);
    e.d=m;e.target.set(m.x,0,m.z);e.seen=performance.now();
  });
}
function addLog(m){const d=document.createElement('div');
  d.innerHTML='<em>'+m.id+'</em> '+m.status;logEl.prepend(d);while(logEl.children.length>6)logEl.lastChild.remove()}

/* ---------- Simulator data dummy (ganti dengan WebSocket asli) ---------- */
const dockPt=i=>({x:DOCKX[i],z:16.5}),AISLE=[-14,-8];
const slotPt=()=>({x:(Math.random()<.5?-1:1)*rnd(5,22),z:AISLE[Math.random()*2|0]});
const stagePt=()=>({x:rnd(-24,24),z:rnd(5,10)});
function route(a,b){const fa=a.z>=3,fb=b.z>=3,P=[{x:a.x,z:a.z}];
  if(fa&&fb)P.push({x:b.x,z:a.z});
  else if(fa)P.push({x:a.x,z:3},{x:0,z:3},{x:0,z:b.z});
  else if(fb)P.push({x:0,z:a.z},{x:0,z:3},{x:b.x,z:3});
  else P.push({x:0,z:a.z},{x:0,z:b.z});
  P.push({x:b.x,z:b.z});return P}
class Agent{
  constructor(id,type,label,speed,plan){Object.assign(this,{id,type,label,speed,plan,pos:{x:rnd(-10,10),z:rnd(5,9)},q:[],path:[],wait:0,load:false,state:'idle',status:'Siap',dir:{x:0,z:1},off:{x:0,z:0},blk:0,yielding:false,pr:0})}
  vis(){return{x:this.pos.x+this.off.x,z:this.pos.z+this.off.z}}
  // deteksi agen lain berprioritas lebih tinggi: stop kalau di depan, minggir (offset lajur) kalau dekat
  scan(dt,ux,uz){let stop=false,near=false;
    if(this.blk<6)for(const o of movers){if(o.pr>=this.pr)continue;const rx=o.pos.x-this.pos.x,rz=o.pos.z-this.pos.z,ds=Math.hypot(rx,rz);if(ds>3.5)continue;near=true;
      const f=rx*ux+rz*uz,l=Math.abs(rx*uz-rz*ux);if(f>-.3&&(ds<1.8||l<1.4))stop=true}
    this.blk=stop?this.blk+dt:Math.max(0,this.blk-dt*2);
    const k=Math.min(1,dt*4),tx=near?uz*1.4:0,tz=near?-ux*1.4:0;this.off.x+=(tx-this.off.x)*k;this.off.z+=(tz-this.off.z)*k;
    return stop}
  idle(s){this.status=s;this.state='idle';this.wait=3}
  step(dt){
    if(this.wait>0){this.wait-=dt;this.scan(dt,this.dir.x,this.dir.z);return}
    if(!this.path.length){
      if(!this.q.length){this.plan(this);if(!this.q.length)return}
      this.cur=this.q.shift();this.path=route(this.pos,this.cur.to).slice(1);this.status=this.cur.status;this.state='moving'}
    const t=this.path[0],dx=t.x-this.pos.x,dz=t.z-this.pos.z,d=Math.hypot(dx,dz),m=this.speed*dt;
    if(d>.001){this.dir={x:dx/d,z:dz/d}}
    if(this.scan(dt,this.dir.x,this.dir.z)){if(!this.yielding){this.yielding=true;this.status='Memberi jalan';this.state='working'}return}
    if(this.yielding){this.yielding=false;this.status=this.cur.status;this.state='moving'}
    if(d<=m){this.pos.x=t.x;this.pos.z=t.z;this.path.shift();
      if(!this.path.length){const s=this.cur;if('load' in s)this.load=s.load;if(s.wait){this.wait=s.wait;this.status=s.ws;this.state='working'}}}
    else{this.pos.x+=dx/d*m;this.pos.z+=dz/d*m}
  }
  msg(){const v=this.vis();return{id:this.id,type:this.type,label:this.label,x:v.x,z:v.z,status:this.status,state:this.state,load:this.load}}
}
const docked=()=>trucks.map((t,i)=>t.phase==='dock'?i:-1).filter(i=>i>=0);
class Truck{
  constructor(i,plate,phase,z,t=0){this.i=i;this.id='TRK-0'+(i+1);this.label=plate;this.phase=phase;this.z=z;this.t=t;this.status='Menuju dock';this.state='moving'}
  step(dt){
    if(this.phase==='in'){this.z-=5*dt;if(this.z<=21.2){this.z=21.2;this.phase='dock';this.t=0;this.status='Bongkar muat';this.state='working'}}
    else if(this.phase==='dock'){this.t+=dt;if(this.t>=40){this.phase='out';this.status='Selesai, keluar dock';this.state='moving'}}
    else if(this.phase==='out'){this.z+=5*dt;if(this.z>=75){this.z=75;this.phase='wait';this.t=rnd(3,8);this.status='Antre di luar';this.state='idle'}}
    else{this.t-=dt;if(this.t<=0){this.phase='in';this.status='Menuju dock';this.state='moving'}}
  }
  msg(){return{id:this.id,type:'truck',label:this.label,x:DOCKX[this.i],z:this.z,status:this.status,state:this.state,load:false,progress:this.phase==='dock'?this.t/40*100:null}}
}
class Follower{
  constructor(id,label,o){this.id=id;this.label=label;this.o=o}
  step(){}
  msg(){const o=this.o,v=o.vis();return{id:this.id,type:'worker',label:this.label,x:v.x-o.dir.x*1.4,z:v.z-o.dir.z*1.4,status:o.state==='idle'?'Menunggu barang':'Mendorong hand pallet',state:o.state,load:false}}
}
const trucks=[new Truck(0,'B 9021 KXA','dock',21.2,12),new Truck(1,'D 4417 TRL','in',48),new Truck(2,'F 8830 MPR','in',75)];
const forkPlan=a=>{const d=docked();if(!d.length)return a.idle('Menunggu truk');
  const dk=dockPt(d[Math.random()*d.length|0]),sl=slotPt();
  a.q=Math.random()<.55
   ?[{to:dk,status:'Menuju dock',load:true,wait:2,ws:'Mengambil pallet'},{to:sl,status:'Membawa pallet ke rak',load:false,wait:2.5,ws:'Menaruh di rak'}]
   :[{to:sl,status:'Menuju rak',load:true,wait:2.5,ws:'Mengambil dari rak'},{to:dk,status:'Membawa pallet ke dock',load:false,wait:2,ws:'Menurunkan di dock'}]};
const hpPlan=a=>{const d=docked();if(!d.length)return a.idle('Menunggu barang');
  a.q=[{to:dockPt(d[Math.random()*d.length|0]),status:'Menuju dock',load:true,wait:2,ws:'Memuat pallet'},{to:stagePt(),status:'Mengantar ke staging',load:false,wait:2,ws:'Menurunkan pallet'}]};
const wkPlan=a=>{a.q=[{to:Math.random()<.5?stagePt():slotPt(),status:'Berjalan',wait:3,ws:'Mengecek stok'}]};
const hp=[new Agent('HP-01','handpallet','Hand pallet 1',1.8,hpPlan),new Agent('HP-02','handpallet','Hand pallet 2',1.8,hpPlan)];
const agents=[...trucks,
  ...[1,2,3].map(i=>new Agent('FL-0'+i,'forklift','Forklift '+i,4.2,forkPlan)),...hp,
  new Follower('OP-01','Operator 1',hp[0]),new Follower('OP-02','Operator 2',hp[1]),
  ...[3,4].map(i=>new Agent('OP-0'+i,'worker','Operator '+i,1.5,wkPlan))];
const movers=agents.filter(a=>a instanceof Agent);movers.forEach((a,i)=>a.pr=i); // forklift > hand pallet > operator
function startSim(){
  $('#src').textContent='Sumber: simulator (data dummy)';
  let last=performance.now(),acc=0;
  setInterval(()=>{const n=performance.now(),dt=Math.min((n-last)/1000,.5);last=n;acc+=dt;
    agents.forEach(a=>a.step(dt));
    if(acc>=.5){acc=0;onData(agents.map(a=>a.msg()))}},100);
}
function startWS(url){
  $('#src').textContent='Menyambung ke '+url+'…';
  const open=()=>{const ws=new WebSocket(url);
    ws.onopen=()=>$('#src').textContent='Sumber: live · '+url;
    ws.onmessage=e=>{try{onData(JSON.parse(e.data))}catch(_){}};
    ws.onclose=()=>{$('#src').textContent='Terputus, mencoba lagi…';setTimeout(open,2000)}};open();
}
const qs=new URLSearchParams(location.search);qs.get('ws')?startWS(qs.get('ws')):startSim();

/* ---------- Kamera (orbit sederhana) ---------- */
const C={tx:0,tz:6,th:.45,ph:.78,r:78};let goal=null;
const VIEWS={top:{tx:0,tz:0,th:0,ph:.12,r:95},dock:{tx:0,tz:20,th:.35,ph:.9,r:42},rack:{tx:0,tz:-10,th:.2,ph:.8,r:48}};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{goal={...VIEWS[b.dataset.v]};follow=false;syncFollow()});
function placeCam(){cam.position.set(C.tx+C.r*Math.sin(C.ph)*Math.sin(C.th),C.r*Math.cos(C.ph),C.tz+C.r*Math.sin(C.ph)*Math.cos(C.th));cam.lookAt(C.tx,0,C.tz)}
const ptr=new Map();let moved=0,pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;goal=null;pinch=0});
canvas.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)C.r=T.MathUtils.clamp(C.r*pinch/d,15,150);pinch=d}
  else if(e.shiftKey||e.buttons===2){const s=C.r*.0016;follow=false;syncFollow();C.tx-=(dx*Math.cos(C.th)+dy*Math.sin(C.th))*s;C.tz+=(dx*Math.sin(C.th)-dy*Math.cos(C.th))*s}
  else{C.th-=dx*.006;C.ph=T.MathUtils.clamp(C.ph-dy*.005,.1,1.35)}});
const endp=e=>{if(ptr.size===1&&moved<6)pick(e);ptr.delete(e.pointerId);pinch=0};
canvas.addEventListener('pointerup',endp);canvas.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId)});
canvas.addEventListener('wheel',e=>{e.preventDefault();C.r=T.MathUtils.clamp(C.r*(1+e.deltaY*.001),15,150);goal=null},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Seleksi & panel detail ---------- */
const ray=new T.Raycaster(),ring=new T.Mesh(new T.RingGeometry(1,1.25,40),new T.MeshBasicMaterial({color:0xff7a1a,side:T.DoubleSide}));
ring.rotation.x=-Math.PI/2;ring.position.y=.08;ring.visible=false;scene.add(ring);
function pick(e){const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
  const hit=ray.intersectObjects([...ents.values()].map(x=>x.g),true)[0];select(hit?hit.object.userData.id:null)}
function select(id){if(sel)ents.get(sel)?.chip.classList.remove('sel');sel=id;follow=false;syncFollow();
  $('#detail').style.display=id?'block':'none';ring.visible=!!id;if(id)ents.get(id).chip.classList.add('sel')}
const syncFollow=()=>{$('#follow').textContent=follow?'Lepas':'Ikuti'};
$('#follow').onclick=()=>{follow=!follow;goal=null;syncFollow()};$('#close').onclick=()=>select(null);
function renderPanel(){
  const names={truck:'Truk',forklift:'Forklift',handpallet:'Hand pallet',worker:'Operator'},cnt={};
  ents.forEach(e=>{const c=cnt[e.d.type]||(cnt[e.d.type]=[0,0]);c[1]++;if(e.d.state!=='idle')c[0]++});
  $('#counts').innerHTML=Object.keys(names).map(k=>'<div class="row"><span>'+names[k]+'</span><b>'+(cnt[k]?cnt[k][0]+' aktif / '+cnt[k][1]:'-')+'</b></div>').join('');
  if(!sel)return;const e=ents.get(sel),d=e.d;
  $('#dName').textContent=d.id;$('#dType').textContent=names[d.type]+' · '+d.label;
  const rows=[['Status',d.status],['Kecepatan',(e.speed*3.6).toFixed(0)+' km/j'],['Posisi',d.x.toFixed(1)+', '+d.z.toFixed(1)+' m'],['Muatan',d.load?'Membawa pallet':'Kosong'],['Update',((performance.now()-e.seen)/1000).toFixed(1)+' dtk lalu']];
  if(d.type==='worker')rows.splice(3,1);
  $('#dRows').innerHTML=rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
  const has=d.progress!=null;$('#bar').style.display=has?'block':'none';if(has)$('#bar i').style.width=d.progress+'%';
}
setInterval(renderPanel,250);

/* ---------- Loop render ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new T.Clock(),v3=new T.Vector3(),prev=new T.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,now=performance.now();
  ents.forEach(e=>{
    prev.copy(e.g.position);e.g.position.lerp(e.target,1-Math.exp(-dt*4));
    const vx=(e.g.position.x-prev.x)/dt,vz=(e.g.position.z-prev.z)/dt,sp=Math.hypot(vx,vz);e.speed+=(sp-e.speed)*.2;
    if(e.d.type!=='truck'&&sp>.3){let a=Math.atan2(vx,vz)-e.rot;a=Math.atan2(Math.sin(a),Math.cos(a));e.rot+=a*Math.min(1,dt*6);e.g.rotation.y=e.rot}
    const u=e.g.userData;if(u.cargo)u.cargo.visible=!!e.d.load;
    if(u.body)u.body.position.y=e.speed>.3?Math.abs(Math.sin(t*9))*.07:0;
    v3.copy(e.g.position);v3.y=u.h;v3.project(cam);
    const off=v3.z>1||now-e.seen>10000;e.chip.style.display=off?'none':'flex';
    if(!off)e.chip.style.transform='translate('+((v3.x*.5+.5)*innerWidth)+'px,'+((-v3.y*.5+.5)*innerHeight)+'px) translate(-50%,-110%)';
    e.dot.style.background=now-e.seen>10000?'var(--idle)':STC[e.d.state]||'var(--idle)';
  });
  if(sel){const e=ents.get(sel);ring.position.x=e.g.position.x;ring.position.z=e.g.position.z+(e.d.type==='truck'?5:0);
    const s=e.d.type==='truck'?4:e.d.type==='forklift'?1.6:1;ring.scale.set(s,s,s);
    if(follow){C.tx+=(e.g.position.x-C.tx)*.08;C.tz+=(e.g.position.z-C.tz)*.08}}
  if(goal){let done=true;for(const k in goal){C[k]+=(goal[k]-C[k])*.08;if(Math.abs(goal[k]-C[k])>.01)done=false}if(done)goal=null}
  placeCam();renderer.render(scene,cam);requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
